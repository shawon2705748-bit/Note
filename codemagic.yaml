workflows:
  android-workflow:
    name: Android Debug Workflow
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Find and Build APK
        script: |
          # সাব-ফোল্ডার থেকে gradlew খুঁজে বের করে পারমিশন দিয়ে বিল্ড করবে
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found!"
            exit 1
          fi
    artifacts:
      - '**/app/build/outputs/apk/debug/*.apk'
