workflows:
  android-workflow:
    name: Android Debug Workflow
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build Debug APK directly
        script: |
          # সরাসরি আপনার সাব-ফোল্ডারের নাম দিয়ে দিন (যদি ফোল্ডারের নাম note হয়)
          cd note || cd .
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - '**/app/build/outputs/apk/debug/*.apk'
