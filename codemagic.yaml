workflows:
  android-workflow:
    name: Android Debug Workflow
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Grant execute permission for gradlew
        script: |
          chmod +x gradlew
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
